<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taskora – Work Smart. Earn Globally.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='13' fill='%2316a34a'/%3E%3Cpath d='M13 14h22M24 14v8' stroke='white' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3Cpath d='M15 29l7 7 12-14' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0b2239">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#0f1f2e;--mute:#64748b;--line:#e8edf3;--g:#16a34a;--g2:#22c55e;--navy:#0b2239;--gold:#f5b21b;--chip:#e9f8ef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a141f;--card:#112233;--ink:#eaf1f8;--mute:#93a4b6;--line:#1e3349;--chip:#12382a}}
:root[data-theme="dark"]{--bg:#0a141f;--card:#112233;--ink:#eaf1f8;--mute:#93a4b6;--line:#1e3349;--chip:#12382a}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
button{font:inherit;cursor:pointer;border:0}
aside{width:236px;background:var(--navy);color:#cfe0ee;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;flex-shrink:0;overflow-y:auto}
.logo{font-size:23px;font-weight:800;color:#fff;letter-spacing:.5px;padding:4px 10px 0}
.logo i{color:var(--g2);font-style:normal}
.tag{font-size:11px;padding:0 10px 16px;color:#9fb6c9}
.nav{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:10px;background:none;color:#cfe0ee;text-align:left;width:100%;font-weight:500}
.nav:hover{background:#ffffff14}
.nav.on{background:var(--g);color:#fff;font-weight:700}
.invite{margin-top:auto;border:1px solid #ffffff22;border-radius:14px;padding:16px;text-align:center;color:#fff;font-weight:700;background:#ffffff0d}
.invite button{margin-top:10px;background:var(--g2);color:#04230f;border-radius:20px;padding:9px 14px;font-weight:700}
main{flex:1;min-width:0;padding:16px 22px 28px}
header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
#menu{display:none;background:var(--card);color:var(--ink);font-size:20px;padding:8px 12px;border-radius:10px}
header input{flex:1;max-width:420px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.sp{flex:1}
.user{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#16a34a,#0b2239);color:#fff;display:grid;place-items:center;font-weight:800}
.pro{font-size:11px;background:var(--chip);color:var(--g);padding:2px 8px;border-radius:10px;display:inline-block}
.hero{border-radius:18px;padding:30px;color:#fff;background:linear-gradient(120deg,#052e2b,#0a4d3a 55%,#0f6b43);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
.hero h1{font-size:clamp(28px,4vw,40px);font-weight:800}.hero h1 span{color:var(--g2)}
.hero p{margin:8px 0 18px;font-size:18px;max-width:420px;font-weight:500}
.btn{background:var(--g);color:#fff;padding:10px 20px;border-radius:22px;font-weight:700}
.btn:hover{background:#15803d}.btn.sm{padding:8px 22px;border-radius:18px}
.tier{background:#0b2239cc;border-radius:14px;padding:18px;min-width:250px}
.tier b.gold{font-size:24px;color:var(--gold);display:block;margin:6px 0 10px}
.bar{height:8px;background:#ffffff33;border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--gold);border-radius:6px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}
.card{background:var(--card);border-radius:16px;padding:18px;border:1px solid var(--line)}
.stat{display:flex;gap:14px;align-items:center}
.ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.stat small{color:var(--mute);font-size:13px}.stat strong{display:block;font-size:24px;font-weight:800}
.up{color:var(--g);font-size:12px;font-weight:600}
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
h2{font-size:19px;font-weight:800;margin-bottom:10px}
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row .t{flex:1;min-width:0}.row .t b{display:block}.row .t small{color:var(--mute)}
.price{background:var(--chip);color:var(--g);font-weight:700;font-size:13px;padding:3px 9px;border-radius:8px;white-space:nowrap}
.thumb{width:54px;height:44px;border-radius:8px;background:var(--chip);display:grid;place-items:center;font-size:24px}
.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.ring div{width:96px;height:96px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-weight:800;font-size:24px;line-height:1.1}
.ring small{font-size:13px;font-weight:500;display:block}
.copy{display:flex;gap:8px;margin-top:8px}
.copy input,.f input,.f select,.f textarea{flex:1;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;width:100%}
.act{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px;gap:10px}
.pos{color:var(--g);font-weight:700}.neg{color:#e11d48;font-weight:700}
.promo{border-radius:16px;padding:24px;color:#fff;background:linear-gradient(120deg,#052e2b,#0f6b43)}
.promo h2{color:var(--g2);font-size:24px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:11px 8px;border-top:1px solid var(--line)}th{color:var(--mute);font-weight:600}
.pill{padding:3px 10px;border-radius:10px;font-size:12px;font-weight:700}
.pill.p{background:#fff4d6;color:#a16207}.pill.a{background:var(--chip);color:var(--g)}
.f{display:grid;gap:12px;max-width:420px}.f label{font-size:13px;color:var(--mute);font-weight:600;display:grid;gap:5px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:#0b2239;color:#fff;padding:12px 20px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:100}
#toast.show{opacity:1;transform:translateX(-50%)}
.scrim{display:none}
@media(max-width:980px){.grid4{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}}
@media(max-width:820px){
aside{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:.25s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
body.open aside{transform:none}body.open .scrim{display:block;position:fixed;inset:0;background:#0007;z-index:20}
#menu{display:block}.uname{display:none}main{padding:12px}header input{min-width:0}.hero{padding:22px}.tier{width:100%}
.wide{overflow-x:auto}}
@media(max-width:480px){.grid4{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.auth{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:16px;background:rgba(11,34,57,.94);overflow-y:auto}.auth .card{width:100%;max-width:420px;margin:auto}.pill.r{background:#ffe4e6;color:#be123c}
.stage{height:320px;border-radius:16px;background:radial-gradient(circle at 50% 40%,#16405f,#0b2239 70%);cursor:grab;touch-action:pan-y;overflow:hidden}.stage:active{cursor:grabbing}
.ptitle{font-size:24px;font-weight:800}.crumb{color:var(--mute);font-size:15px;margin-top:6px}.crumb a{color:var(--g);text-decoration:none}
.sh{font-size:17px;font-weight:700;margin-bottom:4px}
.inf{display:flex;gap:12px;margin:12px 0}.inf .i{flex:0 0 22px;height:22px;border-radius:50%;background:#fbbf24;color:#1a1a1a;font-weight:800;font-size:13px;display:grid;place-items:center;font-family:Georgia,serif;margin-top:2px}.inf p{color:var(--mute);line-height:1.7}
.gbtn{display:inline-block;margin-top:14px;padding:13px 22px;border-radius:12px;color:#fff;text-decoration:none;font-weight:600;background:linear-gradient(90deg,#1e90ff,#b01cf0)}
.feebox{background:var(--bg);border-radius:14px;padding:16px;margin:14px 0}
.pay{width:100%;padding:15px;border-radius:12px;color:#fff;font-weight:600;font-size:17px;background:linear-gradient(90deg,#0ea5e9,#c026d3)}.pay:disabled{opacity:.6}
.f input:focus{outline:none;border-color:#4f6ef7}

/* ---- brand and page background ---- */
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px}
.brand .mark{flex-shrink:0;filter:drop-shadow(0 4px 10px rgba(22,163,74,.35))}
.hlogo{display:none}
:root{--glow1:rgba(34,197,94,.16);--glow2:rgba(59,130,246,.13);--dot:rgba(15,31,46,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glow1:rgba(34,197,94,.16);--glow2:rgba(56,189,248,.10);--dot:rgba(255,255,255,.05)}}
:root[data-theme="dark"]{--glow1:rgba(34,197,94,.16);--glow2:rgba(56,189,248,.10);--dot:rgba(255,255,255,.05)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:radial-gradient(700px 420px at 92% -8%,var(--glow1),transparent 70%),radial-gradient(620px 460px at -6% 108%,var(--glow2),transparent 70%),radial-gradient(var(--dot) 1.2px,transparent 1.3px) 0 0/26px 26px,var(--bg)}
.auth{background:radial-gradient(640px 420px at 85% 0%,rgba(34,197,94,.30),transparent 70%),radial-gradient(560px 420px at 0% 100%,rgba(59,130,246,.22),transparent 70%),radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.3px) 0 0/26px 26px,linear-gradient(145deg,#06202f,#0b2239 55%,#0b3b33)}
@media(max-width:820px){.hlogo{display:block;line-height:0}}
