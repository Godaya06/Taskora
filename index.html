const WHATSAPP_NUMBER='254719791629';

let T=null,me=null,view='dashboard',admReady=false,vidTimer=null,D={tasks:[],subs:[],tx:[],wd:[],aSubs:[],aWd:[],vids:[],aClaims:[],aUsers:[],aSv:[],aTasks:[],sv:{package:null,surveys:[],packages:[],daily:0,used:0,days:30}};
try{T=localStorage.getItem('tk')}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kes=n=>'KES '+Number(n).toLocaleString('en-KE');
const ago=d=>{const m=Math.floor((Date.now()-new Date(d))/60000);return m<1?'just now':m<60?m+'m ago':m<1440?Math.floor(m/60)+'h ago':Math.floor(m/1440)+'d ago'};
const pc=s=>s==='Approved'||s==='Paid'?'a':s==='Rejected'?'r':'p';
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600)}
function showOv(h){$('ov').innerHTML=h;$('ov').style.display='grid'}
function hideOv(){clearInterval(pollP);$('ov').style.display='none';$('ov').innerHTML=''}
function applyTheme(){let t='auto';try{t=localStorage.getItem('tk-theme')||'auto'}catch(e){}document.documentElement.dataset.theme=t==='auto'?'':t}

async function api(path,opt={}){try{return await api0(path,opt)}catch(e){throw e instanceof TypeError?new Error('No connection to the server. Check your internet and try again.'):e}}
async function api0(path,opt={}){
 const r=await fetch('/api'+path,{method:opt.method||(opt.body?'POST':'GET'),headers:{'Content-Type':'application/json',...(T?{Authorization:'Bearer '+T}:{})},body:opt.body?JSON.stringify(opt.body):undefined});
 const j=await r.json().catch(()=>({}));
 if(r.status===401&&T&&!path.startsWith('/auth'))logout();
 if(!r.ok)throw new Error(j.error||(r.status>=500?'The server is starting up or unavailable. Wait a minute and try again.':'Something went wrong'));
 return j;
}
function logout(){T=null;me=null;admReady=false;try{localStorage.removeItem('tk')}catch(e){}showAuth('login')}

function showAuth(mode){
 const reg=mode==='register',ref=new URLSearchParams(location.search).get('ref')||'';
 showOv(`<div class="card"><div class="brand" style="margin-bottom:16px"><svg class="mark" width="46" height="46" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="tkg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#0f766e"/></linearGradient></defs><rect width="48" height="48" rx="13" fill="url(#tkg)"/><path d="M13 14h22M24 14v8" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M15 29l7 7 12-14" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><div><div class="logo" style="color:var(--ink);padding:0">TASKORA</div><div style="color:var(--mute);font-size:12px">Work smart. Earn globally.</div></div></div><h2>${reg?'Create your account':'Welcome back'}</h2><div class="f">
 ${reg?'<label>Full name<input id="a_name" autocomplete="name"></label><label>Phone number (we send you a code)<input id="a_phone" inputmode="tel" placeholder="0712 345 678"></label>':''}
 <label>Email<input id="a_email" type="email" autocomplete="email"></label>
 <label>Password${reg?' (8+ characters)':''}<input id="a_pw" type="password" autocomplete="${reg?'new-password':'current-password'}"></label>
 ${reg?`<label>Referral code (optional)<input id="a_ref" value="${esc(ref)}"></label>`:''}
 <p id="aerr" style="color:#e11d48;line-height:1.5"></p><button class="btn" onclick="authGo('${mode}')">${reg?'Sign up':'Log in'}</button></div>${reg?'':'<p style="margin-top:12px;font-size:14px"><a href="#" style="color:var(--g)" onclick="showForgot();return false">Forgot password?</a></p>'}
 <p style="margin-top:14px;font-size:14px;color:var(--mute)">${reg?'Already have an account?':'New here?'} <a href="#" style="color:var(--g);font-weight:700" onclick="showAuth('${reg?'login':'register'}');return false">${reg?'Log in':'Create account'}</a></p><p style="color:var(--mute);font-size:11px;margin-top:8px">${APP_VERSION}</p></div>`);
}
async function authGo(mode){
 const b={email:$('a_email').value.trim(),password:$('a_pw').value};
 if(mode==='register'){b.name=$('a_name').value;b.phone=$('a_phone').value;b.ref=$('a_ref').value.trim()}
 try{const r=await api('/auth/'+mode,{body:b});T=r.token;try{localStorage.setItem('tk',T)}catch(e){}await boot();if(mode==='register'&&r.otpSent===false&&me&&me.verified===false)toast('We couldn’t send the code. Tap Resend code.')}catch(e){const x=$('aerr');if(x)x.textContent=e.message;toast(e.message)}
}
async function loadAdmin(){
 [D.aSubs,D.aWd,D.aClaims,D.aUsers,D.aSv,D.aTasks]=await Promise.all([api('/admin/submissions'),api('/admin/withdrawals'),api('/admin/claims'),api('/admin/users'),api('/admin/survey-responses'),api('/admin/tasks')]);
 admReady=true;
}
async function refresh(){
 me=await api('/me');
 if(!me.activated&&!me.isAdmin){D.tasks=[];D.subs=[];D.tx=[];D.wd=[];D.vids=[];return}
 const [t,s,x,w,vd,sv]=await Promise.all([api('/tasks'),api('/submissions'),api('/transactions'),api('/withdrawals'),api('/videos'),api('/surveys').catch(()=>D.sv)]);
 D.tasks=t;D.subs=s;D.tx=x;D.wd=w;
 D.vids=vd.map(v=>({...v,_until:v.waitLeft>0?Date.now()+v.waitLeft*1000:0}));
 D.sv=sv;
 if(me.isAdmin&&view==='admin')await loadAdmin();
}
async function boot(){
 if(!T)return showAuth(new URLSearchParams(location.search).get('ref')?'register':'login');
 try{await refresh()}catch(e){showAuth('login');const x=$('aerr');if(x)x.textContent='Couldn’t load your account: '+e.message;return}
 if(!me)return showAuth('login');
 hideOv();render();scrollTo(0,0);
}
function go(v){view=v;document.body.classList.remove('open');location.hash=v;render();scrollTo(0,0);refresh().then(render).catch(()=>{})}

function startTask(id){
 const k=D.tasks.find(x=>x.id==id);if(!k)return;
 showOv(`<div class="card"><h2>${esc(k.title)}</h2><p style="color:var(--mute);margin-bottom:12px">${esc(k.description)}</p><div class="f"><label>Your answer / feedback<textarea id="ans" rows="5" placeholder="Write at least 10 characters"></textarea></label><button class="btn" onclick="submitTask(${k.id})">Submit for ${kes(k.reward)}</button><button class="btn" style="background:var(--line);color:var(--ink)" onclick="hideOv()">Cancel</button></div></div>`);
}
async function submitTask(id){
 const a=$('ans').value.trim();if(a.length<10)return toast('Write at least 10 characters');
 try{await api('/tasks/'+id+'/submit',{body:{answer:a}});hideOv();toast('Submitted – under review');await refresh();render()}catch(e){toast(e.message)}
}
async function withdraw(){
 try{await api('/withdrawals',{body:{amount:$('wa').value,phone:$('wp').value,wallet:(document.querySelector('input[name=wal]:checked')||{}).value||'main'}});toast('Withdrawal requested');await refresh();render()}catch(e){toast(e.message)}
}
function copyLink(){const l=me.link;(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>toast('Link copied'),()=>{const i=$('rl');if(i){i.select();document.execCommand('copy')}toast('Link copied')})}
async function adm(path){try{await api('/admin/'+path,{method:'POST'});await refresh();render();toast('Done')}catch(e){toast(e.message)}}
async function addTask(){
 try{await api('/admin/tasks',{body:{title:$('nt').value,description:$('nd').value,reward:+$('nr').value,minutes:+$('nm').value||10,icon:$('ni').value.trim()||'📋',category:$('nc').value}});toast('Task added');await refresh();render()}catch(e){toast(e.message)}
}

const taskRow=k=>`<div class="row"><div class="thumb">${esc(k.icon)}</div><div class="t"><b>${esc(k.title)}</b><small>${esc(k.description)}</small></div><div><span class="price">${kes(k.reward)}</span><br><small style="color:var(--mute)">⏱ ${k.minutes} min</small></div><button class="btn sm" onclick="startTask(${k.id})">Start</button></div>`;
const actRows=()=>D.tx.slice(0,5).map(a=>`<div class="act"><span>${esc(a.text)}</span><span class="${a.amount<0?'neg':'pos'}">${a.amount===0?'':(a.amount<0?'-':'+')+kes(Math.abs(a.amount))}</span><span style="color:var(--mute)">${ago(a.created_at)}</span></div>`).join('')||'<p style="color:var(--mute)">No activity yet.</p>';
const refCard=()=>{const p=Math.min(me.refs,10)*10;return `<div class="card"><h2>👥 Your referral progress</h2><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class="ring" style="background:conic-gradient(var(--g2) ${p}%,var(--line) 0)"><div><span>${Math.min(me.refs,10)}/10<small>Activated</small></span></div></div><div class="card" style="flex:1;min-width:140px"><small style="color:var(--mute)">Current reward</small><br><strong style="font-size:24px">${kes(me.refReward)}</strong></div></div><p style="margin-top:14px;font-size:14px">Your referral link</p><div class="copy"><input id="rl" readonly value="${esc(me.link)}"><button class="btn" onclick="copyLink()">Copy</button></div></div>`};
const empty=t=>`<p style="color:var(--mute)">${t}</p>`;

const V={

 ${me.spin?`<div class="card" style="margin:14px 0;display:flex;align-items:center;justify-content:space-between;gap:12px"><b>🎁 You have a free spin waiting!</b><button class="btn sm" onclick="showSpin()">Spin</button></div>`:''}

tasks(){const q=$('q').value.toLowerCase();const l=D.tasks.filter(k=>(k.title+k.description).toLowerCase().includes(q));

surveys(){const S=D.sv;
 if(!S.package)return `<div class="card"><h2>📊 Surveys</h2><p style="color:var(--mute);line-height:1.7">Choose a package to get access to paid surveys for ${S.days} days. The package price buys <b>access</b> only. Each survey pays the reward shown on it, and surveys are only available when clients post them, so earnings are not guaranteed.</p></div><br>${S.packages.map(p=>`<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h2 style="margin:0">${esc(p.name)}</h2><small style="color:var(--mute)">Access to up to ${p.daily} surveys per day</small></div><button class="btn" onclick="buyAsk('${esc(p.name)}')">${kes(p.price)}</button></div></div>`).join('')}`;
 const left=Math.max(0,Math.ceil((new Date(S.until)-Date.now())/864e5));
 return `<div class="card"><h2>📊 Surveys</h2><p style="line-height:1.8"><span class="pill a">${esc(S.package)}</span> ${S.used} of ${S.daily} surveys done today · ${left} day${left===1?'':'s'} of access left</p></div><br><div class="card">${S.surveys.map(v=>`<div class="row"><div class="thumb">📝</div><div class="t"><b>${esc(v.title)}</b><small>${esc(v.description)} · ${v.count} question${v.count===1?'':'s'}</small></div><span class="price">${kes(v.reward)}</span><button class="btn sm" ${S.used>=S.daily?'disabled style="opacity:.5"':''} onclick="openSurvey(${v.id})">Start</button></div>`).join('')||empty('No surveys right now. New ones appear when clients post them.')}</div>`},
verify(){return `<div class="card"><h2>Verify your phone</h2><p style="color:var(--mute);line-height:1.7">We sent a 6-digit code by SMS to <b>${esc(String(me.phone||'').replace(/^(\d{3})\d+(\d{3})$/,'$1•••••$2'))}</b>. Enter it below to continue.</p><div class="f" style="max-width:none;margin-top:12px"><label>Code<input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456"></label><button class="pay" onclick="verifyOtp()">Verify</button><button class="btn" id="rsb" style="background:var(--line);color:var(--ink)" onclick="resendOtp()">Resend code</button></div></div>`},
forex(){return catView('forex')},
ai(){return catView('ai')},
hotel(){return catView('hotel')},
spin(){return `<div class="card" style="text-align:center"><h2>🎡 Spin Wheel</h2><p style="color:var(--mute);line-height:1.7;margin:8px 0 14px">${me.spin?'You have a free spin waiting. Prizes go to your Main wallet.':'You have no spin right now. Every new member gets one free spin when they activate their account.'}</p>${me.spin?'<button class="pay" onclick="showSpin()">Spin now</button>':''}</div>`},
activate(){return `<div class="card"><h2>Activate Account</h2><p style="color:var(--mute);line-height:1.7">Complete a one-time payment to unlock your dashboard and earning modules.</p>
<div class="feebox"><small style="color:var(--mute);letter-spacing:.5px">ACTIVATION FEE</small><div style="font-size:34px;font-weight:800">${kes(me.activationFee)}</div><small style="color:var(--mute)">One time payment via M-Pesa</small></div>

videos(){return `<div class="grid4" style="grid-template-columns:1fr 1fr"><div class="card"><small style="color:var(--mute)">Avail. balance</small><strong style="display:block;font-size:22px">${kes(me.balance)}</strong></div><div class="card"><small style="color:var(--mute)">Lifetime earned</small><strong style="display:block;font-size:22px">${kes(me.lifetime)}</strong></div></div>
<div class="card"><b>How it works</b><ol style="margin:8px 0 0 18px;line-height:1.8;font-size:14px"><li>Unlock a video by paying the fee with M-Pesa. The fee is not refunded.</li><li>Watch the whole video on YouTube.</li><li>Like it and leave a real comment.</li><li>Come back and submit your comment as proof. The reward is paid after review.</li></ol></div><br>
${D.vids.map(videoCard).join('')||empty('No videos right now. Check back soon.')}`},
subs(){return `<div class="card wide"><h2>My submissions</h2>${D.subs.length?`<table><tr><th>Task</th><th>Reward</th><th>Status</th><th>When</th></tr>${D.subs.map(s=>`<tr><td>${esc(s.title)}</td><td>${kes(s.reward)}</td><td><span class="pill ${pc(s.status)}">${s.status}</span></td><td>${ago(s.created_at)}</td></tr>`).join('')}</table>`:empty('No submissions yet. Start a task to see it here.')}</div>`},
wallet(){return `<div class="card"><h2>My wallets</h2>${walletRows()}${progressBar()}</div><br><div class="card"><h2>Transactions</h2>${actRows()}<br><button class="btn" onclick="go('withdraw')">Withdraw</button></div>`},
withdraw(){
 const un=me.mainPct>=me.unlockPct,W=me.wallets||{main:me.balance};
 const rows=Object.keys(WNAMES).map(k=>{const lock=k!=='main'&&!un;return `<label class="wrow${lock?' lk':''}"><span>${WNAMES[k]}: <b>${kes(W[k]||0)}</b>${lock?' 🔒':''}</span><input type="radio" name="wal" value="${k}" ${k==='main'?'checked':''} ${lock?'disabled':''}></label>`}).join('');
 return `<div class="cols"><div class="card"><h2>Withdraw to M-Pesa</h2><p style="color:var(--mute);margin-bottom:10px">Choose a wallet. Minimum ${kes(me.minWithdraw)}.</p><div class="wlist">${rows}</div>${progressBar()}<div class="f" style="margin-top:14px"><label>Amount (KES)<input id="wa" type="number" min="${me.minWithdraw}" placeholder="${me.minWithdraw}"></label><label>M-Pesa number<input id="wp" value="${esc(me.phone||'')}" placeholder="0712 345 678" inputmode="tel"></label><button class="btn" onclick="withdraw()">Request withdrawal</button></div></div><div class="card wide"><h2>History</h2>${D.wd.length?`<table><tr><th>Amount</th><th>Wallet</th><th>Number</th><th>Status</th><th>When</th></tr>${D.wd.map(w=>`<tr><td>${kes(w.amount)}</td><td>${WNAMES[w.wallet||'main']}</td><td>${esc(w.phone)}</td><td><span class="pill ${pc(w.status)}">${w.status}</span></td><td>${ago(w.created_at)}</td></tr>`).join('')}</table>`:empty('No withdrawals yet.')}</div></div>`},

 <div class="cols">${refCard()}<div class="card"><h2>My Team</h2><div style="display:flex;gap:10px;margin-bottom:14px"><div class="card" style="flex:1;padding:12px"><small style="color:var(--mute)">Total invites</small><br><b style="font-size:22px">${me.invites}</b></div><div class="card" style="flex:1;padding:12px"><small style="color:var(--mute)">Total activated</small><br><b style="font-size:22px">${me.refs}</b></div></div><h2>How it works</h2><p style="line-height:1.7">Share your link. You earn ${kes(me.referralBonus)} in your Main wallet when a friend you invite activates their account. Reach 10 activated friends to unlock Platinum.</p>${progressBar()}</div></div>`},

 return `<div class="grid4">${T4.map(t=>`<div class="card" style="${t[0]===me.tier?'outline:2px solid var(--g)':''}"><h2>${t[0]}${t[0]===me.tier?' ✓':''}</h2><b>${t[1]}</b><p style="color:var(--mute);margin-top:6px">${t[2]}</p></div>`).join('')}</div>`},
premium(){return `<div class="card"><h2>🚀 Taskora Boost</h2><div id="stage" class="stage"></div><p style="color:var(--mute);font-size:13px;margin:8px 0 14px">Drag left or right to rotate the machine.</p>
<p style="line-height:1.7;margin-bottom:8px">Boost is our planned premium plan for members who want more from their tasks. These perks are coming soon:</p>
<div class="act"><span>⚡ Faster task reviews</span><span style="color:var(--mute)">Planned</span></div>
<div class="act"><span>💼 Higher-paying tasks</span><span style="color:var(--mute)">Planned</span></div>
<div class="act"><span>🎯 Bonus on referrals</span><span style="color:var(--mute)">Planned</span></div>
<br><a class="btn" style="display:inline-block;text-decoration:none" href="mailto:${esc(SUPPORT_EMAIL)}?subject=Taskora%20Boost%20waitlist%20(${esc(me.email)})">Join the waitlist</a>
<p style="color:var(--mute);font-size:13px;margin-top:14px">Taskora doesn’t pay returns on deposits. All earnings come from tasks you complete and friends you refer.</p></div>`},

let raf=0,rend=null;
function stop3D(){cancelAnimationFrame(raf);raf=0;if(rend){rend.dispose();rend=null}}
function loadThree(){return window.THREE?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function init3D(){
 const el=$('stage');if(!el)return;
 try{await loadThree()}catch(e){el.innerHTML='<p style="color:#fff;padding:20px">Couldn’t load the 3D view. Check your connection and try again.</p>';return}
 if($('stage')!==el||view!=='premium')return;
 const W=el.clientWidth,H=el.clientHeight;
 try{rend=new THREE.WebGLRenderer({antialias:true,alpha:true})}catch(e){el.innerHTML='<p style="color:#fff;padding:20px">3D isn’t supported on this device.</p>';return}
 rend.setSize(W,H);rend.setPixelRatio(Math.min(devicePixelRatio||1,2));el.appendChild(rend.domElement);
 const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,W/H,0.1,100);cam.position.set(5,3,8);cam.lookAt(0,0,0);
 scene.add(new THREE.AmbientLight(0xffffff,.75));const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(4,6,5);scene.add(dl);
 const M=(c,m,r)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r});
 const silver=M(0xd9dee3,.5,.45),dark=M(0x14181d,.3,.6),blade=M(0x2b3138,.2,.7),green=new THREE.MeshBasicMaterial({color:0x22c55e});
 const box=(w,h,d,m,x,y,z)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.set(x,y,z);return b};
 const g=new THREE.Group();scene.add(g);
 g.add(box(2.4,2.6,3,silver,0,0,0));
 g.add(box(2.5,.12,3.1,silver,0,1.36,0));
 g.add(box(2.4,2.6,.5,dark,0,0,1.75));
 g.add(box(.5,.1,.04,green,.7,-1.15,-1.52));
 g.add(box(.35,.3,.12,dark,-.6,-1,-1.55));g.add(box(.35,.3,.12,dark,.2,-1,-1.55));
 const spins=[];
 function fan(r,x,y,z,flip){
  const f=new THREE.Group(),sp=new THREE.Group();
  f.add(new THREE.Mesh(new THREE.TorusGeometry(r,r*.09,8,32),dark));
  for(let i=0;i<7;i++){const p=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(r*.22,r*.8,r*.03),blade);b.position.y=r*.45;b.rotation.y=.5;p.rotation.z=i*Math.PI*2/7;p.add(b);sp.add(p)}
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(r*.2,r*.2,r*.1,16),dark);hub.rotation.x=Math.PI/2;sp.add(hub);f.add(sp);
  [.4,.7].forEach(k=>{const t=new THREE.Mesh(new THREE.TorusGeometry(r*k,r*.015,6,32),silver);t.position.z=r*.12;f.add(t)});
  for(let i=0;i<4;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(r*2,r*.02,r*.02),silver);b.rotation.z=i*Math.PI/4;b.position.z=r*.12;f.add(b)}
  f.position.set(x,y,z);if(flip)f.rotation.y=Math.PI;g.add(f);spins.push(sp);
 }
 fan(.55,0,.65,2.02);fan(.55,0,-.65,2.02);
 fan(.32,0,.8,-1.52,true);fan(.32,0,0,-1.52,true);fan(.32,0,-.8,-1.52,true);
 g.rotation.y=-.6;
 let drag=false,lx=0;
 el.onpointerdown=e=>{drag=true;lx=e.clientX};
 window.onpointerup=()=>{drag=false};
 el.onpointermove=e=>{if(drag){g.rotation.y+=(e.clientX-lx)*.01;lx=e.clientX}};
 const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
 (function loop(t){
  raf=requestAnimationFrame(loop);
  if(!drag&&!reduce)g.rotation.y+=.004;
  if(!reduce)spins.forEach(s=>s.rotation.z-=.25);
  g.position.y=Math.sin(t/900)*.08;
  rend.render(scene,cam);
 })(0);
}
const fmtT=s=>Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

  document.querySelectorAll('[data-until]').forEach(el=>{

 showOv(`<div class="card"><h2>Reset password</h2><div class="f"><label>Phone number<input id="fp" inputmode="tel" placeholder="07xxxxxxxx"></label><button class="btn" onclick="sendReset()">Send code</button><button class="btn" style="background:var(--line);color:var(--ink)" onclick="showAuth('login')">Back</button></div></div>`);
}
async function sendReset(){
 const ph=$('fp').value.trim();
 try{await api('/auth/forgot',{body:{phone:ph}});
  showOv(`<div class="card"><h2>Reset password</h2><p style="color:var(--mute);margin-bottom:12px">If that number is registered, we sent a code by SMS.</p><div class="f"><input type="hidden" id="fp2" value="${esc(ph)}"><label>Code<input id="fc" inputmode="numeric" maxlength="6"></label><label>New password (8+ characters)<input id="fn" type="password" autocomplete="new-password"></label><button class="btn" onclick="doReset()">Change password</button></div></div>`);
 }catch(e){toast(e.message)}
}
async function doReset(){
 try{await api('/auth/reset',{body:{phone:$('fp2').value,code:$('fc').value.trim(),password:$('fn').value}});toast('Password changed. Please log in.');showAuth('login')}catch(e){toast(e.message)}
}
const SPIN_COLORS=['#64748b','#16a34a','#0ea5e9','#a855f7','#f59e0b'];
function showSpin(){
 if(!me||!me.spin)return;
 const seg=me.spinSegments;let a=0;
 const parts=seg.map((s,i)=>{const from=a;a+=s.w*3.6;return SPIN_COLORS[i%5]+' '+from+'deg '+a+'deg'}).join(',');
 showOv(`<div class="card" style="text-align:center"><h2>🎁 Your free spin</h2><p style="color:var(--mute);margin-bottom:12px">Welcome to Taskora! Spin once for a bonus. Each slice is as big as its chance of winning.</p>
 <div style="position:relative;width:230px;height:230px;margin:14px auto 18px"><div style="position:absolute;top:-14px;left:50%;transform:translateX(-50%);z-index:2;font-size:26px;line-height:1">🔻</div><div id="wheel" style="width:100%;height:100%;border-radius:50%;background:conic-gradient(${parts});border:6px solid #fff;box-shadow:0 8px 26px rgba(0,0,0,.35)"></div></div>
 <div style="display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:center;margin-bottom:14px;font-size:12px">${seg.map((s,i)=>`<span style="display:inline-flex;align-items:center;gap:5px"><i style="width:10px;height:10px;border-radius:3px;background:${SPIN_COLORS[i%5]}"></i>${esc(s.label)} · ${s.w}%</span>`).join('')}</div>
 <p id="spm" style="min-height:24px;font-weight:700"></p><button id="spb" class="pay" onclick="spinGo()">Spin now</button></div>`);
}
async function spinGo(){
 const b=$('spb');b.disabled=true;
 try{
  const r=await api('/spin',{method:'POST'});
  let a=0,mid=0;me.spinSegments.forEach((s,i)=>{const from=a;a+=s.w*3.6;if(i===r.index)mid=(from+a)/2});
  const w=$('wheel');w.style.transition='transform 4.5s cubic-bezier(.12,.7,.1,1)';
  requestAnimationFrame(()=>{w.style.transform='rotate('+(360*6-mid)+'deg)'});
  setTimeout(()=>{
   $('spm').textContent=r.prize>0?'🎉 You won '+kes(r.prize)+'! It was added to your balance.':'No prize this time. Good luck with your tasks!';
   b.textContent='Continue';b.disabled=false;b.onclick=async()=>{hideOv();await refresh();render()};
  },4700);
 }catch(e){toast(e.message);b.disabled=false}
}
const errCard=m=>'<div class="card"><h2>Something went wrong</h2><p style="color:var(--mute);line-height:1.6">'+esc(m)+'</p><p style="color:var(--mute);font-size:11px;margin-bottom:10px">'+APP_VERSION+'</p><button class="btn" onclick="location.reload()">Reload</button></div>';
addEventListener('error',e=>{const a=$('app');if(a&&(!a.innerHTML.trim()||/Loading…/.test(a.innerHTML)))a.innerHTML=errCard(e.message)});
const WNAMES={main:'Main',ai:'AI Training',hotel:'Hotel Reviews',surveys:'Surveys',youtube:'YouTube Views'};
const CATS={forex:{t:'Forex Trading',i:'📈',w:'main'},ai:{t:'AI Training',i:'🤖',w:'ai'},hotel:{t:'Hotel Reviews',i:'🏨',w:'hotel'}};
const catView=cat=>{const c=CATS[cat],l=D.tasks.filter(k=>(k.category||'forex')===cat);return `<div class="card"><h2>${c.i} ${c.t}</h2><p style="color:var(--mute);font-size:13px;line-height:1.6;margin-bottom:6px">Rewards from these tasks are paid into your ${WNAMES[c.w]} wallet after approval.</p>${l.map(taskRow).join('')||empty('No tasks here right now. New ones appear when clients post them.')}</div>`};
const walletRows=()=>{const W=me.wallets||{main:me.balance};return Object.keys(WNAMES).map(k=>`<div class="act"><span>${WNAMES[k]}${k==='main'?' <small style="color:var(--mute)">(referrals, spin and trading)</small>':''}</span><b>${kes(W[k]||0)}</b></div>`).join('')};
const progressBar=()=>{const p=me.mainPct||0,ok=p>=me.unlockPct;return `<div style="margin-top:14px"><div style="display:flex;justify-content:space-between;font-size:14px"><b>Main wallet progress</b><b>${p}%</b></div><div class="pbar"><i style="width:${p}%"></i>${me.unlockPct>0?`<u style="left:${me.unlockPct}%"></u>`:''}</div><small style="color:var(--mute);line-height:1.6;display:block;margin-top:6px">${me.unlockPct>0?(ok?'Your other wallets are unlocked for withdrawal.':`Reach ${me.unlockPct}% (${kes(Math.ceil(me.minWithdraw*me.unlockPct/100))}) on your Main wallet to unlock withdrawals from your other wallets. Each activated referral adds ${kes(me.referralBonus)}, and spin and trading rewards count too.`):'Percentage of the minimum withdrawal.'}</small></div>`};
function render(){try{renderInner()}catch(err){console.error(err);const a=$('app');if(a)a.innerHTML=errCard(err&&err.message)}}
function renderInner(){
 if(!me)return;
 const unv=me.verified===false,locked=!me.activated&&!me.isAdmin;
 if(!V[view])view='dashboard';
 if(unv&&!['verify','support','settings'].includes(view))view='verify';
 else if(!unv&&locked&&!['activate','support','settings'].includes(view))view='activate';
 const tail=[['support','🎧','Help & Support'],['settings','⚙️','Settings']];
 const items=unv?[['verify','📱','Verify phone']].concat(tail):locked?[['activate','🔓','Activate Account']].concat(tail):NAV.concat(me.isAdmin?[['admin','🛡️','Admin']]:[]);
 $('nav').innerHTML=items.map(n=>`<button class="nav ${n[0]===view?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');
 $('usr').innerHTML=`<div class="av">${esc(me.name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase())}</div><div class="uname">${esc(me.name)}<br><span class="pro">${me.tier} Member</span></div>`;
 if(!V[view])view='dashboard';
 stop3D();
 clearInterval(vidTimer);
 if(view!=='activate')clearInterval(pollT);
 $('app').innerHTML=V[view]();
 if(view==='premium')init3D();
 if(view==='videos')startVidTimer();
}
addEventListener('pageshow',e=>{if(e.persisted&&me)refresh().then(render).catch(()=>{})});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me&&view==='videos')refresh().then(render).catch(()=>{})});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(me&&V[h]&&h!==view)go(h)});
{const h=location.hash.slice(1);if(V[h])view=h}
applyTheme();boot();
</script>
